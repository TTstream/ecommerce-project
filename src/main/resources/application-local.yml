spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/commerceflow
    username: commerceflow
    password: commerceflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug

app:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-should-be-over-32-bytes}
